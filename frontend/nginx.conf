server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser only ever talks to this server, so the
    # backend needs no CORS config and no published port of its own.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed filenames, safe to cache forever
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # must revalidate, or an update never reaches an installed PWA
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (adapter-static writes index.html as the fallback page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
